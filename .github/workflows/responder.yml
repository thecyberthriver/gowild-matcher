name: GoWild matcher responder

# Answers on-demand /search commands. Runs every ~5 min in the cloud so the bot
# replies whether or not your PC is on. (Public repo = free unlimited minutes.)
# Note: GitHub cron isn't real-time — expect up to a few minutes' latency.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gowild-matcher-responder
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restore poll offset
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: poll_offset.json
          key: gowild-matcher-offset-${{ github.run_id }}
          restore-keys: |
            gowild-matcher-offset-

      - name: Answer /search commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MY_ORIGINS: ${{ vars.MY_ORIGINS }}
          LINK_MODE: ${{ vars.LINK_MODE }}
        run: python gowild_matcher.py --serve-once
