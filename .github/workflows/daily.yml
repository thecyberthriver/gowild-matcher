name: GoWild matcher daily

# Runs in GitHub's cloud so it fires whether or not your PC is on.
on:
  schedule:
    # 13:00 UTC daily = 9 AM ET (EDT) / 8 AM ET (EST). No timezone in cron.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gowild-matcher
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restore de-dupe cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: seen.json
          key: gowild-matcher-seen-${{ github.run_id }}
          restore-keys: |
            gowild-matcher-seen-

      - name: Send GoWild matches
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MY_ORIGINS: ${{ vars.MY_ORIGINS }}
        run: python gowild_matcher.py
